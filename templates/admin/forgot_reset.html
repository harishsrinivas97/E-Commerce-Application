{% extends 'base.html' %}
{% block title %}Set New Admin Password | Zing-Zing Store{% endblock %}

{% block content %}
<div class="auth-wrapper py-4">
    <div class="auth-box">

        <!-- HEADER -->
        <div class="auth-top text-center mb-4">
            <div class="auth-icon-badge text-success mb-2" style="background-color: rgba(16, 185, 129, 0.1);">
                <i class="fa-solid fa-lock-open"></i>
            </div>
            <h3 class="fw-bold mb-1">Set New Admin Password</h3>
            <p class="text-muted small">Choose a strong new password for your admin account.</p>
        </div>

        <form method="POST" action="/admin/forgot-reset">

            <!-- PASSWORD -->
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold small">New Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-body-tertiary text-muted">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Min. 8 characters" required minlength="8" autofocus>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('password', this)" title="Show/Hide Password">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="mb-3">
                <label for="confirm_password" class="form-label fw-semibold small">Confirm New Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-body-tertiary text-muted">
                        <i class="fa-solid fa-lock-check"></i>
                    </span>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat new password" required minlength="8">
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('confirm_password', this)" title="Show/Hide Password">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-warning w-100 py-2 fw-semibold text-dark mt-2">
                <i class="fa-solid fa-floppy-disk me-1"></i> Save New Password
            </button>

        </form>

        <div class="text-center mt-3 pt-2 border-top">
            <a href="/admin-login" class="text-muted text-decoration-none small">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Admin Login
            </a>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePasswordVisibility(fieldId, btn) {
    const input = document.getElementById(fieldId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
    }
}
</script>
{% endblock %}
