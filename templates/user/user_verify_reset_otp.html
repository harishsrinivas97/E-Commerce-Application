{% extends 'base.html' %}
{% block title %}Verify Reset OTP | Zing-Zing Store{% endblock %}

{% block content %}
<div class="auth-wrapper py-4">
    <div class="auth-box">

        <!-- HEADER -->
        <div class="auth-top text-center mb-4">
            <div class="auth-icon-badge text-primary mb-2">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h3 class="fw-bold mb-1">Verify Reset Code</h3>
            <p class="text-muted small">Enter the 6-digit OTP code sent to your email to verify your identity.</p>
        </div>

        <form method="POST" action="/user-verify-reset-otp">

            <div class="mb-3 text-center">
                <label for="otp" class="form-label fw-semibold small d-block">One-Time Password (OTP)</label>
                <input type="text"
                       id="otp"
                       name="otp"
                       class="form-control text-center fw-bold fs-4 py-2"
                       placeholder="&bull; &bull; &bull; &bull; &bull; &bull;"
                       maxlength="6"
                       pattern="[0-9]{6}"
                       inputmode="numeric"
                       style="letter-spacing: .35em;"
                       required
                       autofocus>
                <div class="form-text small text-muted mt-2">
                    <i class="fa-solid fa-clock me-1"></i> OTP is valid for 5 minutes
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
                <i class="fa-solid fa-circle-check me-1"></i> Verify OTP Code
            </button>

        </form>

        <div class="text-center mt-3 pt-2 border-top">
            <a href="/user-forgot-password" class="text-muted text-decoration-none small">
                <i class="fa-solid fa-arrow-left me-1"></i> Request a New OTP
            </a>
        </div>

    </div>
</div>
{% endblock %}
