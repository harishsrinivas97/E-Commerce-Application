{% extends 'base.html' %}
{% block title %}Forgot Password | Zing-Zing Store{% endblock %}

{% block content %}
<div class="auth-wrapper py-4">
    <div class="auth-box">

        <!-- HEADER -->
        <div class="auth-top text-center mb-4">
            <div class="auth-icon-badge text-primary mb-2">
                <i class="fa-solid fa-key"></i>
            </div>
            <h3 class="fw-bold mb-1">Forgot Password?</h3>
            <p class="text-muted small">Enter your registered email address to receive a 6-digit OTP code.</p>
        </div>

        <form method="POST" action="/user-forgot-password">

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold small">Registered Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-body-tertiary text-muted">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required autofocus>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
                <i class="fa-solid fa-paper-plane me-1"></i> Send OTP Code
            </button>

        </form>

        <div class="text-center mt-3 pt-2 border-top">
            <a href="/user-login" class="text-muted text-decoration-none small">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Customer Login
            </a>
        </div>

    </div>
</div>
{% endblock %}
